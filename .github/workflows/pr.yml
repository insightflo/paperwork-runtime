name: PR

# [CI-REDUCE 2026-11-13] 경량 잡(policy)+조건부 전체 스위트. 판정은 scripts/ci-scope.sh 소유 — `if:` 에 규칙을 복제하지 않는다. ci-full 은 one-shot(consume_label 로 회수).
on:
  pull_request:
    branches: [main, chore/ci-merge-gate-rollout-base]
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  # GITHUB_TOKEN 봇 PR은 pull_request 이벤트가 없어 refresh-lockfile.yml 이 이 ref로 직접 dispatch한다.
  workflow_dispatch:
    inputs:
      scope:
        description: "policy = 필수 검사만(lockfile 봇 경로), full = 전체 스위트"
        type: choice
        options: [policy, full]
        default: policy

permissions: { contents: read }

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}-${{ ((github.event_name == 'pull_request' && (github.event.action == 'ready_for_review' || (github.event.action == 'labeled' && github.event.label.name == 'ci-full'))) || (github.event_name == 'workflow_dispatch' && inputs.scope == 'full')) && format('full-{0}-{1}', github.event.pull_request.head.sha || github.sha, github.event.pull_request.base.sha || 'dispatch') || 'fast' }}
  cancel-in-progress: true

jobs:
  # policy 는 브랜치 보호의 필수 상태 체크다. 이름·id 를 바꾸지 않는다.
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: { contents: read, pull-requests: write, actions: read }
    outputs:
      heavy: ${{ steps.finalize.outputs.heavy }}
      full: ${{ steps.finalize.outputs.full }}
      docs_only: ${{ steps.finalize.outputs.docs_only }}
      reason: ${{ steps.scope.outputs.reason }}
      reused_full: ${{ steps.finalize.outputs.reused_full }}
      reused_run_id: ${{ steps.attest.outputs.reused_run_id }}
      reused_run_attempt: ${{ steps.attest.outputs.reused_run_attempt }}
      full_bypass: ${{ steps.finalize.outputs.full_bypass }}
    steps:
      - name: Find reusable full-CI attestation
        id: attest
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}", HEAD_SHA: "${{ github.event.pull_request.head.sha }}", BASE_SHA: "${{ github.event.pull_request.base.sha }}" }
        run: |
          cat > "$RUNNER_TEMP/attest.cjs" <<'EOF'
          const{execFileSync:X}=require("child_process"),fs=require("fs"),{GITHUB_REPOSITORY:G,HEAD_SHA:H,BASE_SHA:B,GITHUB_OUTPUT:O}=process.env;
          const emit=(k,v)=>{console.log(`${k}=${v}`);if(O)fs.appendFileSync(O,`${k}=${v}\n`)},fin=(ok,i,a)=>{emit("has_valid_attestation",ok);emit("reused_run_id",i||"");emit("reused_run_attempt",a||"")};
          try{const api=p=>JSON.parse(X("gh",["api",p],{encoding:"utf8",maxBuffer:1<<27})),runs=[];
          const scan=r=>{const q=`repos/${G}/actions/workflows/pr.yml/runs?head_sha=${H}&event=pull_request&status=completed&per_page=100`+(r?`&created=${r}`:""),f=api(q+"&page=1"),t=f.total_count|0;
          if(t>=1000){if(!r)return scan("2000-01-01.."+new Date().toISOString());const[a,b]=r.split(".."),m=new Date((+new Date(a)+ +new Date(b))/2).toISOString();
          if(+new Date(b)- +new Date(a)<2e3)throw Error("runs truncated at "+r);scan(a+".."+m);scan(m+".."+b);return}
          runs.push(...(f.workflow_runs||[]));for(let p=2;p<=Math.ceil(t/100);p++)runs.push(...api(`${q}&page=${p}`).workflow_runs)};scan("");
          for(const r of runs){if(r.path!==".github/workflows/pr.yml"||r.event!=="pull_request"||r.head_sha!==H||!r.head_repository||!r.repository||r.head_repository.id!==r.repository.id||r.status!=="completed"||r.conclusion!=="success")continue;
          const att=r.run_attempt,jobs=api(`repos/${G}/actions/runs/${r.id}/attempts/${att}/jobs?per_page=100`).jobs||[];
          if(!jobs.some(j=>j.name==="verify-tests-full-gate"&&j.status==="completed"&&j.conclusion==="success"))continue;
          const a=(api(`repos/${G}/actions/runs/${r.id}/artifacts?per_page=100`).artifacts||[]).find(z=>z.name===`ci-full-attest-${att}-${H}-${B}`&&!z.expired);if(!a)continue;
          fs.writeFileSync("/tmp/att.zip",X("gh",["api",`repos/${G}/actions/artifacts/${a.id}/zip`],{maxBuffer:1<<27}));
          let p;try{p=JSON.parse(X("unzip",["-p","/tmp/att.zip","ci-full-attest.json"],{encoding:"utf8"}))}catch(e){continue}
          if(!p||p.schema_version!==1||String(p.run_id)!==String(r.id)||String(p.attempt)!==String(att)||p.head_sha!==H||p.base_sha!==B)continue;
          fin("true",r.id,att);process.exit(0)}fin("false")}catch(e){fin("false");console.log("::warning::attestation lookup failed closed: "+e.message)}
          EOF
          node "$RUNNER_TEMP/attest.cjs"
      - { uses: actions/checkout@v4, with: { fetch-depth: 0 } }
      - name: Resolve change range
        id: range
        run: |
          base="${{ github.event.pull_request.base.sha }}"; head="${{ github.event.pull_request.head.sha }}"
          [ -n "$base" ] && [ -n "$head" ] || { base="$(git rev-parse origin/main)"; head="$(git rev-parse HEAD)"; }
          git diff --name-only "$base...$head" > "$RUNNER_TEMP/changed.txt" 2>/dev/null || git diff --name-only "$base" "$head" > "$RUNNER_TEMP/changed.txt" 2>/dev/null || : > "$RUNNER_TEMP/changed.txt"
          ok=false
          if [ "$(git rev-parse --verify -q HEAD^1)" = "$base" ] && [ "$(git rev-parse --verify -q HEAD^2)" = "$head" ]; then
            git -c core.quotepath=false diff --name-only --no-renames "$base...$head" > "$RUNNER_TEMP/rust-changed.txt" 2>/dev/null && git -c core.quotepath=false diff --name-only --no-renames "$base" HEAD >> "$RUNNER_TEMP/rust-changed.txt" 2>/dev/null && ok=true
          fi
          [ "$ok" = true ] || : > "$RUNNER_TEMP/rust-changed.txt"
          echo "merge_parents_ok=$ok" | tee -a "$GITHUB_OUTPUT"; wc -l "$RUNNER_TEMP/changed.txt" "$RUNNER_TEMP/rust-changed.txt"
      - name: Resolve CI scope
        id: scope
        env: { EVENT_NAME: "${{ github.event_name }}", EVENT_ACTION: "${{ github.event.action }}", EVENT_LABEL: "${{ github.event.label.name }}", PR_DRAFT: "${{ github.event.pull_request.draft }}", PR_LABELS: "${{ join(github.event.pull_request.labels.*.name, ',') }}", INPUT_SCOPE: "${{ inputs.scope }}", CI_FULL_LABEL: "ci-full", CHANGED_FILE_LIST: "${{ runner.temp }}/changed.txt", RUST_CHANGED_FILE_LIST: "${{ runner.temp }}/rust-changed.txt" }
        run: bash scripts/ci-scope.sh
      - name: Finalize scope
        id: finalize
        env: { HEAVY: "${{ steps.scope.outputs.heavy }}", FULL: "${{ steps.scope.outputs.full }}", DOCS_ONLY: "${{ steps.scope.outputs.docs_only }}", ATTEST: "${{ steps.attest.outputs.has_valid_attestation }}", PARENTS: "${{ steps.range.outputs.merge_parents_ok }}", FORK_FULL: "${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && (github.event.action == 'ready_for_review' || (github.event.action == 'labeled' && github.event.label.name == 'ci-full')) }}" }
        run: |
          FULL="$FULL"; HEAVY="$HEAVY"; DOCS_ONLY="$DOCS_ONLY"; REUSED=false
          if [ "$ATTEST" = "true" ] && [ "$PARENTS" = "true" ] && [ "$DOCS_ONLY" != "true" ]; then REUSED=true; FULL=false; fi
          if [ "$FORK_FULL" = "true" ]; then FULL=true; DOCS_ONLY=false; HEAVY=true; fi
          BYPASS=0; if [ "$FULL" = "false" ] && { [ "$DOCS_ONLY" = "true" ] || [ "$REUSED" = "true" ]; }; then BYPASS=1; fi
          printf 'full=%s\nheavy=%s\ndocs_only=%s\nreused_full=%s\nfull_bypass=%s\n' "$FULL" "$HEAVY" "$DOCS_ONLY" "$REUSED" "$BYPASS" | tee -a "$GITHUB_OUTPUT"
      - name: Consume one-shot ci-full label
        if: steps.scope.outputs.consume_label == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}", PR_NUMBER: "${{ github.event.pull_request.number }}", HEAD_SHA: "${{ github.event.pull_request.head.sha }}", EVENT_LABEL: "${{ github.event.label.name }}" }
        run: |
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)" = "$HEAD_SHA" ]; then gh pr edit "$PR_NUMBER" --remove-label "$EVENT_LABEL" || echo "::warning::could not remove label $EVENT_LABEL"; else echo "::warning::PR head moved since event; keeping label $EVENT_LABEL"; fi
      - { name: Skip heavy checks, if: "steps.finalize.outputs.heavy != 'true'", env: { REASON: "${{ steps.scope.outputs.reason }}" }, run: 'echo "경량 검사 생략 — reason=$REASON"' }
      - { name: Block manual lockfile edits, if: "steps.finalize.outputs.heavy == 'true' && github.event_name == 'pull_request' && github.head_ref != 'chore/refresh-lockfile'", run: 'grep -qx "pnpm-lock.yaml" "$RUNNER_TEMP/changed.txt" && { echo "Do not commit pnpm-lock.yaml in pull requests. CI owns lockfile updates."; exit 1; } || :' }
      - { uses: pnpm/action-setup@v4, if: "steps.finalize.outputs.heavy == 'true'", with: { version: 9.15.4, run_install: false } }
      - { uses: actions/setup-node@v4, if: "steps.finalize.outputs.heavy == 'true'", with: { node-version-file: .nvmrc, cache: pnpm } }
      # [write-chokepoint] heartbeat_runs/workflow_runs 직접 UPDATE 를 인가 쓰기 계층으로 강제(PR#679/#682 재발 차단).
      - { name: Enforce run-status write chokepoint, if: "steps.finalize.outputs.heavy == 'true'", run: node scripts/check-run-status-write-chokepoint.mjs --self-test && node scripts/check-run-status-write-chokepoint.mjs }
      # 무조건 실행 — heavy 게이트를 두면 문서 전용/드래프트 판정으로 frozen 마이그레이션 편집이 우회된다.
      - { name: Enforce frozen DB migrations, env: { BASE_REF: "${{ github.base_ref || 'main' }}" }, run: 'git rev-parse --verify --quiet "refs/remotes/origin/${BASE_REF}" >/dev/null || git fetch --no-tags origin "${BASE_REF}:refs/remotes/origin/${BASE_REF}"; node scripts/check-frozen-migrations.mjs --base "origin/${BASE_REF}"' }
      - { name: Validate Dockerfile deps stage, if: "steps.finalize.outputs.heavy == 'true'", run: bash scripts/check-dockerfile-deps-stage.sh }
      - { name: Validate dependency resolution when manifests change, id: depval, if: "steps.finalize.outputs.heavy == 'true'", run: 'if grep -Eq ''(^|/)package\.json$|^pnpm-workspace\.yaml$|^\.npmrc$|^pnpmfile\.(cjs|js|mjs)$'' "$RUNNER_TEMP/changed.txt"; then pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile && echo "ran=1" >> "$GITHUB_OUTPUT"; fi' }
      - { name: Install dependencies, if: "steps.finalize.outputs.heavy == 'true' && steps.depval.outputs.ran != '1'", run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile }
      - { name: Install dependencies from the CI-refreshed lockfile, if: "steps.finalize.outputs.heavy == 'true'", run: pnpm install --frozen-lockfile }
      - { uses: actions/cache@v4, if: "steps.finalize.outputs.heavy == 'true'", with: { path: .cache/tsbuildinfo, key: "${{ runner.os }}-tsbuildinfo-${{ hashFiles('pnpm-lock.yaml', 'tsconfig*.json', '**/tsconfig*.json') }}-${{ github.sha }}", restore-keys: "${{ runner.os }}-tsbuildinfo-${{ hashFiles('pnpm-lock.yaml', 'tsconfig*.json', '**/tsconfig*.json') }}-" } }
      - { name: Typecheck, if: "steps.finalize.outputs.heavy == 'true'", run: node scripts/ci-typecheck.mjs }
      - { name: Gate Rust on rust_changed, id: rust_gate, env: { RUST_CHANGED: "${{ steps.scope.outputs.rust_changed }}" }, run: '[ "$RUST_CHANGED" = "false" ] && echo "skip=1" >> "$GITHUB_OUTPUT" || echo "skip=0" >> "$GITHUB_OUTPUT"' }
      - uses: dtolnay/rust-toolchain@stable
        if: steps.scope.outputs.heavy == 'true' && steps.rust_gate.outputs.skip != '1'
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
        if: steps.scope.outputs.heavy == 'true' && steps.rust_gate.outputs.skip != '1'
      - { name: Verify Rust workspace, if: "steps.scope.outputs.heavy == 'true' && steps.rust_gate.outputs.skip != '1'", run: cargo clippy --workspace --all-targets --locked -- -D warnings && cargo test --workspace --locked }
  # 문서 전용 생략 신호 — 성공한 verify-tests* 잡이 없으면 병합 가드가 미병합 처리(PR#701). fork 는 docs_only 위조 가능해 같은 repo 만 허용.
  verify-tests-docs-only:
    needs: [policy]
    if: needs.policy.outputs.docs_only == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - { env: { REASON: "${{ needs.policy.outputs.reason }}" }, run: 'echo "documentation-only change: full suite intentionally skipped (reason=$REASON)"' }
  # 아래 다섯 잡+게이트는 전체 스위트 — policy.outputs.full 또는 fork PR 의 full 트리거 이벤트에서만 실행(fork 의 ci-scope.sh 는 신뢰할 수 없어 이벤트 자체로도 켠다).
  verify:
    needs: [policy]
    if: needs.policy.outputs.full == 'true' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && (github.event.action == 'ready_for_review' || (github.event.action == 'labeled' && github.event.label.name == 'ci-full')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - { uses: actions/checkout@v4, with: { ref: "${{ github.sha }}" } }
      - uses: ./.github/actions/ci-install
      - { name: Build, run: pnpm build }
      - { name: Release canary dry run, run: 'git checkout -B master HEAD && git checkout -- pnpm-lock.yaml && ./scripts/release.sh canary --skip-verify --dry-run' }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
      - { name: Verify Rust workspace, run: 'cargo clippy --workspace --all-targets --locked -- -D warnings && cargo test --release --workspace --locked' }
  rust-build:
    needs: [policy]
    if: needs.policy.outputs.full == 'true' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && (github.event.action == 'ready_for_review' || (github.event.action == 'labeled' && github.event.label.name == 'ci-full')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - { uses: actions/checkout@v4, with: { ref: "${{ github.sha }}" } }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/build-rust-workspace.sh
      - { uses: actions/upload-artifact@v4, with: { name: "rust-workspace-bins-${{ github.run_attempt }}", path: "crates/*/target/release/*", if-no-files-found: error, retention-days: 1 } }
  verify-tests:
    needs: [policy, rust-build]
    if: needs.policy.outputs.full == 'true' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && (github.event.action == 'ready_for_review' || (github.event.action == 'labeled' && github.event.label.name == 'ci-full')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy: { fail-fast: false, matrix: { shard: [1, 2, 3] } }
    steps:
      - { uses: actions/checkout@v4, with: { ref: "${{ github.sha }}" } }
      - uses: ./.github/actions/ci-install
      - { uses: actions/download-artifact@v4, with: { name: "rust-workspace-bins-${{ github.run_attempt }}", path: crates/ } }
      - { name: Restore staged Rust binaries, run: 'chmod +x crates/*/target/release/* && [ -n "$(find crates -type f -path "*/target/release/*" -print -quit)" ]' }
      - { name: "Run tests (shard ${{ matrix.shard }}/3)", env: { PAPERCLIP_CI_EXCLUDE_SERIAL_SUITES: "1" }, run: "pnpm test:run --shard=${{ matrix.shard }}/3" }
  # 중량 통합 5종 전용 직렬 잡 — verify-tests 접두사 유지로 병합 가드가 자동 감시한다.
  verify-tests-serial:
    needs: [policy]
    if: needs.policy.outputs.full == 'true' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && (github.event.action == 'ready_for_review' || (github.event.action == 'labeled' && github.event.label.name == 'ci-full')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - { uses: actions/checkout@v4, with: { ref: "${{ github.sha }}" } }
      - uses: ./.github/actions/ci-install
      - { name: Run heavy integration tests serially, run: 'pnpm test:run --no-file-parallelism server/src/__tests__/heartbeat-c5-public-activation.test.ts server/src/__tests__/qa-remediation-admission-root.test.ts server/src/__tests__/mission-owner-authority-flow.integration.test.ts server/src/__tests__/mission-owner-delegate-fix.integration.test.ts server/src/__tests__/plugin-runtime-drain.test.ts' }
  e2e:
    needs: [policy]
    if: needs.policy.outputs.full == 'true' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && (github.event.action == 'ready_for_review' || (github.event.action == 'labeled' && github.event.label.name == 'ci-full')))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - { uses: actions/checkout@v4, with: { ref: "${{ github.sha }}" } }
      - uses: ./.github/actions/ci-install
      - name: Build
        run: pnpm build
      - { uses: actions/cache@v4, id: pw-cache, with: { path: "~/.cache/ms-playwright", key: "${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}" } }
      - { name: Install Playwright, env: { PW_CMD: "${{ steps.pw-cache.outputs.cache-hit == 'true' && 'install-deps' || 'install --with-deps' }}" }, run: 'for attempt in 1 2 3; do sudo apt-get update -o Acquire::Retries=3 && npx playwright $PW_CMD chromium && exit 0; echo "Playwright install attempt ${attempt} failed; retrying in 10s..." >&2; sleep 10; done; exit 1' }
      - name: Generate Paperclip config
        run: |
          mkdir -p ~/.paperclip/instances/default
          cat > ~/.paperclip/instances/default/config.json << 'CONF'
          {"$meta":{"version":1,"updatedAt":"2026-01-01T00:00:00.000Z","source":"onboard"},"database":{"mode":"embedded-postgres"},"logging":{"mode":"file"},"server":{"deploymentMode":"local_trusted","host":"127.0.0.1","port":3100},"auth":{"baseUrlMode":"auto"},"storage":{"provider":"local_disk"},"secrets":{"provider":"local_encrypted","strictMode":false}}
          CONF
      - { name: Run e2e tests, env: { PAPERCLIP_E2E_PORT: "3100", PAPERCLIP_E2E_SKIP_LLM: "true" }, run: 'pnpm run test:e2e' }
      - { uses: actions/upload-artifact@v4, if: "always()", with: { name: playwright-report, path: "tests/e2e/playwright-report/\ntests/e2e/test-results/", retention-days: 14 } }
  # 전체 스위트 검문소 — 성공한 이 run 을 head/base 에 묶어 attestation 으로 남긴다(PR 코드 미실행). fork 는 bypass 면제 없이 통과 강제.
  verify-tests-full-gate:
    needs: [policy, rust-build, verify, verify-tests, verify-tests-serial, e2e]
    if: always() && (needs.policy.outputs.full == 'true' || (((github.event_name == 'pull_request' && (github.event.action == 'ready_for_review' || (github.event.action == 'labeled' && github.event.label.name == 'ci-full'))) || (github.event_name == 'workflow_dispatch' && inputs.scope == 'full')) && !(needs.policy.result == 'success' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.policy.outputs.full_bypass == '1')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read, actions: read }
    env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}", POLICY_FULL: "${{ needs.policy.outputs.full }}", HEAD_SHA: "${{ github.event.pull_request.head.sha }}", BASE_SHA: "${{ github.event.pull_request.base.sha }}", RESULTS: "${{ join(needs.*.result, ' ') }}" }
    steps:
      - { name: Enforce full-suite results, run: '[ "$POLICY_FULL" = "true" ] || { echo "::error::policy.full=$POLICY_FULL (expected true)"; exit 1; }; for r in $RESULTS; do [ "$r" = "success" ] || { echo "::error::sibling job result=$r"; exit 1; }; done' }
      - { uses: actions/checkout@v4, if: "github.event_name == 'pull_request'", with: { ref: "${{ github.sha }}", fetch-depth: 2 } }
      - name: Verify parents + sibling jobs, write attestation
        if: github.event_name == 'pull_request'
        run: |
          [ "$(git rev-parse HEAD^1)" = "$BASE_SHA" ] && [ "$(git rev-parse HEAD^2)" = "$HEAD_SHA" ] || { echo "::error::merge parents mismatch"; exit 1; }
          node <<'EOF'
          const{execFileSync:X}=require("child_process"),{GITHUB_REPOSITORY:G,GITHUB_RUN_ID:I,GITHUB_RUN_ATTEMPT:A}=process.env;
          const jobs=JSON.parse(X("gh",["api",`repos/${G}/actions/runs/${I}/attempts/${A}/jobs?per_page=100`],{encoding:"utf8",maxBuffer:1<<26})).jobs||[];
          const miss=["policy","rust-build","verify","verify-tests (1)","verify-tests (2)","verify-tests (3)","verify-tests-serial","e2e"].filter(n=>!jobs.some(j=>j.name===n&&j.status==="completed"&&j.conclusion==="success"));
          if(miss.length){console.log("::error::missing successful jobs in this attempt: "+miss.join(", "));process.exit(1)}
          EOF
          printf '{"schema_version":1,"run_id":"%s","attempt":"%s","head_sha":"%s","base_sha":"%s"}\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$HEAD_SHA" "$BASE_SHA" > /tmp/ci-full-attest.json
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: ci-full-attest-${{ github.run_attempt }}-${{ github.event.pull_request.head.sha }}-${{ github.event.pull_request.base.sha }}
          path: /tmp/ci-full-attest.json
          if-no-files-found: error
          retention-days: 7
  # 재사용 경로 — policy 가 찾은 attestation 을 이 잡이 독립 재검증한다(검증 주체 분리; PR 코드 미실행).
  verify-tests-reused:
    needs: [policy]
    if: needs.policy.outputs.reused_full == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read, actions: read }
    env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}", HEAD_SHA: "${{ github.event.pull_request.head.sha }}", BASE_SHA: "${{ github.event.pull_request.base.sha }}", RUN_ID: "${{ needs.policy.outputs.reused_run_id }}", ATTEMPT: "${{ needs.policy.outputs.reused_run_attempt }}" }
    steps:
      - { uses: actions/checkout@v4, with: { ref: "${{ github.sha }}", fetch-depth: 2 } }
      - name: Re-verify attested run and payload
        run: |
          [ "$(git rev-parse HEAD^1)" = "$BASE_SHA" ] && [ "$(git rev-parse HEAD^2)" = "$HEAD_SHA" ] || { echo "::error::merge parents mismatch"; exit 1; }
          cat > "$RUNNER_TEMP/rv.cjs" <<'EOF'
          const{execFileSync:X}=require("child_process"),fs=require("fs"),{GITHUB_REPOSITORY:G,HEAD_SHA:H,BASE_SHA:B,RUN_ID:I,ATTEMPT:A}=process.env;
          const die=m=>{console.log("::error::"+m);process.exit(1)},api=p=>JSON.parse(X("gh",["api",p],{encoding:"utf8",maxBuffer:1<<26}));
          const ck=r=>r&&r.path===".github/workflows/pr.yml"&&r.event==="pull_request"&&r.status==="completed"&&r.conclusion==="success"&&String(r.run_attempt)===String(A)&&r.head_repository&&r.repository&&r.head_repository.id===r.repository.id&&r.head_sha===H;
          if(!ck(api(`repos/${G}/actions/runs/${I}`)))die("candidate run failed re-check");
          const jobs=api(`repos/${G}/actions/runs/${I}/attempts/${A}/jobs?per_page=100`).jobs||[];
          if(!jobs.some(j=>j.name==="verify-tests-full-gate"&&j.status==="completed"&&j.conclusion==="success"))die("verify-tests-full-gate not successful in that attempt");
          const art=(api(`repos/${G}/actions/runs/${I}/artifacts?per_page=100`).artifacts||[]).find(z=>z.name===`ci-full-attest-${A}-${H}-${B}`&&!z.expired);if(!art)die("attest artifact missing/expired");
          fs.writeFileSync("/tmp/att.zip",X("gh",["api",`repos/${G}/actions/artifacts/${art.id}/zip`],{maxBuffer:1<<26}));
          let p;try{p=JSON.parse(X("unzip",["-p","/tmp/att.zip","ci-full-attest.json"],{encoding:"utf8"}))}catch(e){die("attest payload unreadable")}
          if(!p||p.schema_version!==1||String(p.run_id)!==String(I)||String(p.attempt)!==String(A)||p.head_sha!==H||p.base_sha!==B)die("attest payload invalid");
          const again=api(`repos/${G}/actions/runs/${I}`);
          if(again.status!=="completed"||again.conclusion!=="success"||String(again.run_attempt)!==String(A))die("run changed after attestation check");
          EOF
          node "$RUNNER_TEMP/rv.cjs"
  # 병합 게이트 — PR 은 policy 성공 + 스위트 경로{full-gate,reused,docs-only} 중 정확히 하나만 성공을 요구한다(0개=미실행, 2개+=판정 모순, 둘 다 차단). if:always()+이벤트 필터 없음 → dispatch 에서도 절대 skipped 되지 않는다.
  ci-merge-gate:
    needs: [policy, verify-tests-full-gate, verify-tests-reused, verify-tests-docs-only]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env: { EVENT_NAME: "${{ github.event_name }}", P_RES: "${{ needs.policy.result }}", FULL_RES: "${{ needs.verify-tests-full-gate.result }}", REUSE_RES: "${{ needs.verify-tests-reused.result }}", DOCS_RES: "${{ needs.verify-tests-docs-only.result }}" }
    steps:
      - name: Enforce merge gate
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            [ "$P_RES" = "success" ] || { echo "::error::merge gate: policy result=$P_RES (expected success)"; exit 1; }
            n=0; bad=0
            for r in "$FULL_RES" "$REUSE_RES" "$DOCS_RES"; do case "$r" in success) n=$((n+1));; skipped) ;; *) bad=1;; esac; done
            [ "$bad" = 0 ] && [ "$n" = 1 ] && { echo "merge gate: exactly one suite path succeeded"; exit 0; }
            echo "::error::merge gate: need exactly one success among full-gate=$FULL_RES reused=$REUSE_RES docs-only=$DOCS_RES"; exit 1
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            [ "$P_RES" = "success" ] && [ "$FULL_RES" = "success" ] && { echo "merge gate: dispatch full suite succeeded"; exit 0; }
            echo "::error::merge gate: dispatch requires policy+verify-tests-full-gate success (policy=$P_RES full=$FULL_RES)"; exit 1
          fi
          echo "::error::merge gate: unsupported event $EVENT_NAME"; exit 1
