[package]
name = "paperwork-bot-runtime"
version = "0.1.0"
edition = "2021"
description = "Native Rust bot governance, token security, and terminal/channel relay runtime for Paperwork"

[lib]
name = "paperwork_bot_runtime"
path = "src/lib.rs"

[[bin]]
name = "paperwork-bot"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
