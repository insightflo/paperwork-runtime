[package]
name = "paperwork-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
paperclip-provider-auth-core = { path = "../provider-auth-core" }
paperclip-provider-runtime-core = { path = "../provider-runtime-core" }
paperclip-quota-router = { path = "../quota-router" }
paperclip-redactor-core = { path = "../redactor-core" }
paperwork-engine-heartbeat = { path = "../engine-heartbeat" }
paperwork-engine-budget = { path = "../engine-budget" }
paperwork-engine-decision = { path = "../engine-decision" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.6"
tokio = { version = "1", features = ["rt", "time", "net"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
uuid = { version = "1", features = ["serde"] }
